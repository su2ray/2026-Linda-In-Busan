["💊","日常與隨身",["個人常備藥（感冒／止痛／胃腸／暈車藥）","濕紙巾／面紙","折疊雨傘","購物環保袋"]]];

const Chk=({on,fn})=><button onClick={fn} aria-pressed={on} className="shrink-0 w-6 h-6 rounded-full border-2 grid place-items-center transition-colors" style={{borderColor:on?'var(--acc)':'var(--line)',background:on?'var(--acc)':'transparent',color:'#fff'}}>{on&&<Ic n="ok" s={14}/>}</button>;
const fmt=n=>Math.round(n).toLocaleString();

function App(){
const [tab,setTab]=useState(()=>ld('tab','tl'));
const v='B';
const [ck,setCk]=useState(()=>ld('ck',{}));
const [cost,setCost]=useState(()=>ld('cost',false));
const [open,setOpen]=useState(null);const [so,setSo]=useState({});const [day,setDay]=useState(()=>ld('day',0));useEffect(()=>sv('day',day),[day]);
useEffect(()=>sv('tab',tab),[tab]);useEffect(()=>sv('ck',ck),[ck]);useEffect(()=>sv('cost',cost),[cost]);
const tg=k=>setCk(o=>({...o,[k]:!o[k]}));
const days=useMemo(()=>build(v),[v]);
const A=v==='A';
const st=useMemo(()=>{const cat={h:0,f:0,t:0,p:0,o:0};let pv=0;
const per=days.map(([l,its])=>{let k=0,w=0;its.forEach(it=>{const pass=it.p===1||(it.p===2&&A);const tw=it.w!=null?it.w:it.k/50;
if(pass){pv+=it.k/50}else{w+=tw;k+=it.w!=null?it.w*50:it.k;cat[it.c==='h'||it.c==='f'||it.c==='t'||it.c==='p'?it.c:'o']+=tw}});return{k,w}});
return{cat,pv,per,tot:Object.values(cat).reduce((a,b)=>a+b,0)}},[days,A]);
const price=A?3480:2758;
const done=days.reduce((a,[l,its],di)=>a+its.filter((x,i)=>ck['u'+di+i]).length,0),all=days.reduce((a,d)=>a+d[1].length,0);
const clAll=CL.reduce((a,c)=>a+c[2].length,0),clDone=CL.reduce((a,c,ci)=>a+c[2].filter((x,i)=>ck['c'+ci+i]).length,0);
return <div className="max-w-md mx-auto pb-16">
<header className="sticky top-0 z-20 px-4 pt-3 pb-3" style={{background:'var(--bg)',borderBottom:'1px solid var(--line)'}}>
<div className="flex items-baseline justify-between"><h1 className="text-xl font-bold">釜山 5 天 4 夜</h1><span className="text-xs" style={{color:'var(--mut)'}}>11/06–11/10・最新版</span></div>
<div className="grid grid-cols-2 gap-2 mt-2">{[['cl','📋 行前清單'],['tl','🗺️ 行程總覽']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className="py-2 rounded-xl text-sm font-semibold" style={{background:tab===k?'var(--acc)':'var(--card)',color:tab===k?'#fff':'var(--ink)',border:'1px solid var(--line)'}}>{l}</button>)}</div>
</header>
<main className="px-4 pt-4">
{tab==='cl'?<>
<div className="card p-3 mb-3"><div className="flex justify-between text-sm font-semibold"><span>整體進度</span><span>{clDone}/{clAll}</span></div><div className="h-2 rounded-full mt-2" style={{background:'var(--line)'}}><div className="h-2 rounded-full" style={{width:clDone/clAll*100+'%',background:'var(--acc)'}}/></div></div>
{CL.map(([e,t,its],ci)=><section key={ci} className="card p-4 mb-3"><h2 className="font-bold mb-2">{e} {t} <span className="text-xs font-normal" style={{color:'var(--mut)'}}>{its.filter((x,i)=>ck['c'+ci+i]).length}/{its.length}</span></h2>
{its.map((x,i)=>{const k='c'+ci+i;return <div key={i} className="flex items-start gap-3 py-1.5"><Chk on={!!ck[k]} fn={()=>tg(k)}/><span className="text-sm leading-6" style={{opacity:ck[k]?.45:1,textDecoration:ck[k]?'line-through':'none'}}>{x}</span></div>})}</section>)}
</>:<>
<section className="card p-4 mb-4">
<button onClick={()=>setCost(!cost)} className="w-full flex items-center justify-between"><span className="flex items-center gap-2 font-bold"><Ic n={cost?'eye':'off'}/>費用儀表板</span><span className="flex items-center gap-1 text-sm font-semibold" style={{color:'var(--acc)'}}>{cost?'':'約 NT$ '+fmt(st.tot)}<span style={{transform:cost?'rotate(180deg)':'none',display:'inline-flex'}}><Ic n="dn"/></span></span></button>
{cost&&<div className="mt-3 text-sm">
<div className="text-3xl font-bold" style={{color:'var(--acc)'}}>NT$ {fmt(st.tot)}</div>
<div className="grid grid-cols-2 gap-2 mt-3">{[['機酒',st.cat.h],['餐費',st.cat.f],['交通',st.cat.t],['Pass',st.cat.p],...(st.cat.o?[['Pass 外景點',st.cat.o]]:[])].map(([l,n])=><div key={l} className="rounded-xl p-2" style={{background:'var(--bg)'}}><div className="text-xs" style={{color:'var(--mut)'}}>{l}</div><div className="font-semibold">NT$ {fmt(n)}</div></div>)}</div>
<h3 className="font-bold mt-4 mb-1">每日小計</h3>
{days.map(([l],i)=><div key={i} className="flex justify-between py-1" style={{borderTop:'1px solid var(--line)'}}><span>Day {i+1}　{l}</span><span>{fmt(st.per[i].k)} KRW／NT$ {fmt(st.per[i].w)}</span></div>)}
<h3 className="font-bold mt-4 mb-1">Visit Busan Pass 價值</h3>
<div className="rounded-xl p-3" style={{background:'var(--bg)'}}>方案票價 NT$ {fmt(price)}<br/>預計兌換原價 NT$ {fmt(st.pv)}<br/><b style={{color:st.pv>=price?'var(--acc)':'var(--hot)'}}>{st.pv>=price?'預計省下':'尚差'} NT$ {fmt(Math.abs(st.pv-price))}</b>
{!A&&<div className="text-xs mt-1" style={{color:'var(--mut)'}}>Big 5 僅含 5 個景點，行程中標示 Pass 的有 6 項，請確認 SPA Land 是否可兌換。</div>}</div>
<div className="text-xs mt-2" style={{color:'var(--mut)'}}>匯率以 1 TWD ≈ 50 KRW 估算；Pass 景點不重複計入花費。</div></div>}
</section>
<div className="grid grid-cols-5 gap-1.5 mb-4">{days.map(([l],i)=><button key={i} onClick={()=>{setDay(i);setOpen(null)}} className="py-2 rounded-xl text-center" style={{background:day===i?'var(--acc)':'var(--card)',color:day===i?'#fff':'var(--ink)',border:'1px solid var(--line)'}}><div className="text-[10px] opacity-80">Day {i+1}</div><div className="text-sm font-bold">{l.slice(0,5)}</div><div className="text-[10px]">週{l.slice(7,8)}</div></button>)}</div>
<div className="text-sm mb-3 flex justify-between" style={{color:'var(--mut)'}}><span>行程完成進度</span><b>{done}/{all}</b></div>
{days.map(([l,its],di)=>di!==day?null:<section key={di} className="mb-6">
<div className="flex items-baseline justify-between mb-2"><h2 className="text-lg font-bold">Day {di+1}　<span className="text-base font-medium">{l}</span></h2><span className="text-xs" style={{color:'var(--mut)'}}>NT$ {fmt(st.per[di].w)}</span></div>
<div className="relative pl-5" style={{borderLeft:'2px solid var(--line)',marginLeft:6}}>
{its.map((it,i)=>{const k='u'+di+i,ok=!!ck[k],isO=open===k,pass=it.p===1||(it.p===2&&A);const tw=it.w!=null?it.w:it.k/50;
return <div key={k} className="card mb-3 relative overflow-hidden">
<span className="absolute w-3 h-3 rounded-full" style={{left:-27,top:18,background:ok?'var(--acc)':'var(--bg)',border:'2px solid var(--acc)'}}/>
<div className="flex gap-3 p-3 items-start">
<Chk on={ok} fn={()=>tg(k)}/>
<div className="flex-1 min-w-0 cursor-pointer" onClick={()=>setOpen(isO?null:k)} style={{opacity:ok?.55:1}}>
<div className="text-xs font-semibold" style={{color:'var(--acc)'}}>{it.t}</div>
<div className="font-semibold leading-snug">{it.n}</div>
<div className="flex flex-wrap items-center gap-1.5 mt-1 text-xs" style={{color:'var(--mut)'}}>
<span className="px-2 py-0.5 rounded-full" style={{background:'var(--bg)'}}>{TAG[it.c]}</span>
{pass&&<span className="px-2 py-0.5 rounded-full text-white" style={{background:'var(--acc)'}}>Pass 免費</span>}
{(it.k>0||it.w)?<span>{pass?'原價 ':''}{it.w!=null?'NT$ '+fmt(tw):fmt(it.k)+' KRW（NT$ '+fmt(tw)+'）'}</span>:null}</div>
</div>
{it.im&&<img src={`https://images.unsplash.com/${IMG[it.im]}?w=500&auto=format&fit=crop&q=60`} alt="" loading="lazy" onError={e=>e.target.style.display='none'} onClick={()=>setOpen(isO?null:k)} className="w-16 h-16 rounded-xl object-cover shrink-0"/>}
</div>
{it.sh&&<div className="px-3 pb-3"><button onClick={()=>setSo(o=>({...o,[k]:!o[k]}))} className="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-bold text-white" style={{background:'var(--hot)'}}><span>💡 點我看這區【想要】清單</span><span style={{transform:so[k]?'rotate(180deg)':'none',display:'inline-flex'}}><Ic n="dn"/></span></button>
{so[k]&&<div className="mt-2 rounded-xl p-3" style={{background:'var(--bg)'}}><div className="text-sm font-bold mb-1">📍 {SH[it.sh][0]}</div>{SH[it.sh][1].map(([tg2,tx],j)=>{const sk='s'+it.sh+j;return <div key={j} className="flex items-start gap-3 py-1.5"><Chk on={!!ck[sk]} fn={()=>tg(sk)}/><span className="text-sm leading-6" style={{opacity:ck[sk]?.45:1,textDecoration:ck[sk]?'line-through':'none'}}><b className="mr-1" style={{color:tg2==='需辦'?'var(--hot)':'var(--acc)'}}>[{tg2}]</b>{tx}</span></div>})}</div>}</div>}
{isO&&<div className="px-3 pb-3 pl-12 text-sm">
{it.note&&<p className="mb-2" style={{color:'var(--mut)'}}>{it.note}</p>}
{it.im&&<img src={`https://images.unsplash.com/${IMG[it.im]}?w=500&auto=format&fit=crop&q=60`} alt="" className="w-full h-32 object-cover rounded-xl mb-2"/>}
<a href={'https://map.naver.com/p/search/'+encodeURIComponent(NAVER_LOC[it.n]||it.n.replace(/[→：].*$/,''))} target="_blank" rel="noopener" className="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-white text-xs font-semibold" style={{background:'var(--acc)'}}><Ic n="map" s={14}/>Naver Map 導航</a></div>}
</div>})}
</div></section>)}
</>}
</main></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
  
</body>
</html>
